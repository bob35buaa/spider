# @package _global_
# E037: Contact Mask-Gated Reward — HDMI-style mask-gated proximity reward
# Key change from E036: Add contact_mask_rew (gain=2.0, sigma=0.3) with proper mask gating
# approach_mask now uses threshold=0.3m (not 100m) for real contact detection
dataset_name: core4d
data_id: 0
robot_type: unitree_g1
embodiment_type: humanoid_object
scene_name: scene_act
ref_dt: 0.0333333
trace_dt: 0.0333333
sim_dt: 0.0166667
physics_dt: 0
warmup_steps: 0

# Contact guidance
contact_guidance: true
guidance_decay_ratio: 1.0
residual_gain_ratio: 1.0
init_pos_actuator_gain: 500.0
init_pos_actuator_bias: 500.0
init_rot_actuator_gain: 50.0
init_rot_actuator_bias: 50.0
object_pos_actuator_names:
  - object_pos_x
  - object_pos_y
  - object_pos_z
object_rot_actuator_names:
  - object_rot_x
  - object_rot_z
  - object_rot_y
improvement_threshold: 0.0

# Timing
horizon: 0.8
ctrl_dt: 0.0333333
knot_dt: 0.1

# Annealing
first_ctrl_noise_scale: 0.5
last_ctrl_noise_scale: 1.0
final_noise_scale: 0.1
joint_noise_scale: 0.05

# CEM
max_num_iterations: 32
num_samples: 1024
temperature: 1.0

# === E035: Local-frame reward (HDMI-style) ===
use_local_frame_reward: true
local_frame_pos_sigma: 0.5
local_frame_ori_sigma: 1.0
local_frame_root_sigma: 0.5
local_frame_joint_sigma: 0.25
local_frame_w_track: 0.5

# Disable old qpos-level weights (not used when local_frame enabled)
use_bounded_qpos_reward: false
base_pos_rew_scale: 10.0
base_rot_rew_scale: 5.0
joint_rew_scale: 1.0
pos_rew_scale: 1.0
rot_rew_scale: 0.3
vel_rew_scale: 0.0

# === E036: DISABLE hand_approach (keep disabled) ===
hand_approach_rew_scale: 0.0
hand_approach_sigma: 3.0
hand_approach_body_names:
  - left_wrist_yaw_link
  - right_wrist_yaw_link

# === E037: Contact mask threshold — real detection (0.3m, not 100m) ===
hand_approach_contact_threshold: 0.3

# === E036: DISABLE stability_penalty (local frame is inherently stable) ===
stability_penalty_scale: 0.0
stability_penalty_threshold: 0.55

# === E036: ENABLE object global tracking (HDMI-style) ===
task_obj_pos_rew_scale: 1.0
task_obj_rot_rew_scale: 1.0

# === E037: Contact mask-gated reward (NEW) ===
contact_mask_rew_scale: 2.0
contact_mask_rew_sigma: 0.3
contact_mask_rew_baseline: 0.0

task_body_rew_scale: 0.0
object_pd_override: false
partner_force_scale: 0.0
viewer: none
save_video: true
