# @package _global_
# E029-act-v2: Object driven by built-in high-gain PD actuators (no contact_guidance decay)
# Object actuators have gains built into scene_act.xml (kp=200/50, kv=40/10)
# ctrl target = ref trajectory object pos/euler → MuJoCo drives object continuously
dataset_name: core4d
task: bucket010_person1
data_id: 0
robot_type: unitree_g1
embodiment_type: humanoid_object
ref_dt: 0.0333333
trace_dt: 0.0333333
sim_dt: 0.0166667
scene_name: scene_act
data_path: /home/ubuntu/Workspace/spider/example_datasets/processed/core4d/unitree_g1/humanoid_object/bucket010_person1/0/trajectory_kinematic_act.npz

# Use contact_guidance to properly separate robot/object control
contact_guidance: true
guidance_decay_ratio: 1.0  # No decay — object gains stay constant
residual_gain_ratio: 1.0   # Keep full gains on last CEM iteration
init_pos_actuator_gain: 30.0
init_pos_actuator_bias: 10.0
init_rot_actuator_gain: 5.0
init_rot_actuator_bias: 2.0

# Hand approach reward
hand_approach_rew_scale: 5.0
hand_approach_sigma: 5.0

# Body tracking
base_pos_rew_scale: 10.0
base_rot_rew_scale: 1.0
joint_rew_scale: 3.0
pos_rew_scale: 3.0
rot_rew_scale: 0.3
contact_rew_scale: 0.0

# CEM
num_samples: 4096
improvement_threshold: 0.0
max_num_iterations: 24
terminate_resample: true
base_pos_threshold: 0.5
object_pos_threshold: 0.5

# Output
viewer: none
save_video: true
