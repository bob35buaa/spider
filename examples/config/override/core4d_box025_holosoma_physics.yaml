# @package _global_
# E007a: Path Y baseline — physics_dt + decimation aligned to Holosoma
# Inherits E006f reward setup (forearm + contact_rew + boosted weights)
dataset_name: core4d
task: box025_person1
data_id: 0
robot_type: unitree_g1
embodiment_type: humanoid_object
ref_dt: 0.0333333
trace_dt: 0.04        # = 2 * sim_dt (must be multiple)

# === Path Y: Holosoma physics alignment ===
sim_dt: 0.02              # = control_dt = Holosoma physics_dt × control_decimation
physics_dt: 0.005         # = 1/Holosoma fps (200Hz)
# sim_decimation auto-computed = sim_dt / physics_dt = 4

scene_name: scene_forearm
num_samples: 2048
terminate_resample: true

# E006f reward (kept for fair comparison)
contact_rew_scale: 1.0
pos_rew_scale: 3.0
rot_rew_scale: 1.0
base_pos_rew_scale: 3.0
base_rot_rew_scale: 1.0
