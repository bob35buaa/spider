# @package _global_
# E030-hybrid: Kinematic object override (post-step qpos write)
# Object position/orientation are forced to reference AFTER each physics step.
# CEM optimizes robot body only; object state in saved trajectory matches ref exactly.
# Purpose: export hybrid trajectory (physical robot + kinematic object) for RL.
dataset_name: core4d
task: box025_person1
data_id: 0
robot_type: unitree_g1
embodiment_type: humanoid_object
ref_dt: 0.0333333
trace_dt: 0.0333333
sim_dt: 0.0166667

# Kinematic object: kp=-1 activates post-step qpos override
partner_force_scale: 1.0
partner_force_spring_kp: -1.0

# Hand approach reward (encourage hands near object for contact)
hand_approach_rew_scale: 5.0
hand_approach_sigma: 5.0

# Body tracking
base_pos_rew_scale: 10.0
base_rot_rew_scale: 1.0
joint_rew_scale: 3.0
pos_rew_scale: 3.0
rot_rew_scale: 0.3
contact_rew_scale: 0.0

# CEM
num_samples: 4096
improvement_threshold: 0.0
max_num_iterations: 24
terminate_resample: true
base_pos_threshold: 0.5

# Output
viewer: none
save_video: true
