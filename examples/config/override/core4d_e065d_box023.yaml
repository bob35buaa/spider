# @package _global_
# E065-D: keep task_obj signal but switch to HDMI-style saturating exp form.
# task_obj_rew = scale * exp(-||obj_err||/sigma) ∈ [0, scale]
# vs original L2: -scale * err²  (unbounded).
# Base: E062 (X1 only).
defaults:
  - core4d_e062_box023
  - _self_

task_obj_use_exp: true
task_obj_pos_sigma: 0.5         # match HDMI default
task_obj_rot_sigma: 0.5
task_obj_pos_rew_scale: 1.0     # weight unchanged (max contribution = 1.0)
task_obj_rot_rew_scale: 1.0
