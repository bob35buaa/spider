# @package _global_
# E028: Damped spring + hand approach (partner models lateral + vertical motion)
dataset_name: core4d
task: bucket010_person1
data_id: 0
robot_type: unitree_g1
embodiment_type: humanoid_object
ref_dt: 0.0333333
trace_dt: 0.0333333
sim_dt: 0.0166667
data_path: /home/ubuntu/Workspace/spider/example_datasets/processed/core4d/unitree_g1/humanoid_object/bucket010_person1/0/trajectory_kinematic_anchored.npz

# E028: Damped spring (partner drives object along ref trajectory)
partner_force_scale: 0.5
partner_force_spring_kp: 20.0
partner_force_spring_kd: -1.0  # auto critical damping

# Hand approach reward (robot maintains contact with moving object)
hand_approach_rew_scale: 5.0
hand_approach_sigma: 5.0

# Body tracking
base_pos_rew_scale: 10.0
base_rot_rew_scale: 1.0
joint_rew_scale: 3.0
pos_rew_scale: 3.0
rot_rew_scale: 0.3
contact_rew_scale: 0.0

# CEM
num_samples: 4096
improvement_threshold: 0.0
max_num_iterations: 24
terminate_resample: true
base_pos_threshold: 0.3
object_pos_threshold: 0.5

# Output
viewer: none
save_video: true
