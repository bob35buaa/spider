# @package _global_
# E018-noconnect: same task-space rewards as E018-connect, but WITHOUT connect constraints
# Tests whether rich rewards alone can drive cooperative box carrying
dataset_name: core4d
task: box025_person1
data_id: 0
robot_type: unitree_g1
embodiment_type: dual_humanoid_object
ref_dt: 0.0333333
trace_dt: 0.0333333
sim_dt: 0.0166667
scene_name: scene_dual_robot

# Joint-space rewards (same as E018-connect)
base_pos_rew_scale: 5.0
base_rot_rew_scale: 1.0
joint_rew_scale: 1.0
pos_rew_scale: 1.0
rot_rew_scale: 0.3
contact_rew_scale: 0.0

# E018 task-space rewards (same weights)
task_obj_pos_rew_scale: 40.0
task_obj_rot_rew_scale: 4.0
task_body_rew_scale: 1.0
task_body_names:
  - pelvis
  - torso_link
  - left_wrist_yaw_link
  - right_wrist_yaw_link
  - left_ankle_roll_link
  - right_ankle_roll_link
  - r2_pelvis
  - r2_torso_link
  - r2_left_wrist_yaw_link
  - r2_right_wrist_yaw_link
  - r2_left_ankle_roll_link
  - r2_right_ankle_roll_link
task_body_weights:
  - 5.0
  - 30.0
  - 5.0
  - 5.0
  - 10.0
  - 10.0
  - 5.0
  - 30.0
  - 5.0
  - 5.0
  - 10.0
  - 10.0

# Interaction reward
interact_rew_scale: 2.0
interact_sigma: 5.0
interact_pairs:
  - [0, 6]
  - [1, 7]
  - [3, 9]

# CEM
num_samples: 2048
temperature: 0.15
max_num_iterations: 24
terminate_resample: true
base_pos_threshold: 0.5
object_pos_threshold: 0.5

# Gibbs
gibbs_sampling: true

# Output
viewer: none
save_video: true
