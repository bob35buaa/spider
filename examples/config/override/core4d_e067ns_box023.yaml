# @package _global_
# E067-NS: full HDMI clone — narrow body partition + soft actuator + exp task_obj + decay.
# Combines all 3 mismatches found across log 82/84/85.
defaults:
  - core4d_e062_box023
  - _self_

# (1) Narrow body partition (log 85 §4)
local_frame_lower_ids: [2, 5, 7, 8, 11, 13]
local_frame_upper_ids: [17, 20, 23, 24, 27, 30]

# (2) Soft actuator dynamics (log 84 §6, E066)
init_pos_actuator_gain: 20.0
init_pos_actuator_bias: 20.0
init_rot_actuator_gain: 0.3
init_rot_actuator_bias: 0.3
guidance_decay_ratio: 0.85

# (3) HDMI saturating exp task_obj form (log 83, E065-D)
task_obj_use_exp: true
task_obj_pos_sigma: 0.5
task_obj_rot_sigma: 0.5
task_obj_pos_rew_scale: 1.0
task_obj_rot_rew_scale: 1.0
